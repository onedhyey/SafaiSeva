<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
          var customFetch = origFetch;
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return customFetch || origFetch; },
                set: function(val) { customFetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() { return customFetch || origFetch; },
                set: function(val) { customFetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>

        window.addEventListener('load', () => {
